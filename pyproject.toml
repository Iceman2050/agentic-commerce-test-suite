[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-commerce-test-suite"
version = "1.0.0"
description = "Cross-surface product-data consistency fixtures and checker for agentic commerce: the same product on a page, in a feed, and in structured data must agree."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["commerce_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
